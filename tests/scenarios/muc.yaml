# Group chats: alice, bob, carol.
# enc: members-only, whois=anyone (OMEMO room); plain: open, whois=moderators.
# new: made by /join (not seeded); drunk_xmpp sets the config of the new
# room (members-only, persistent, whois=anyone, hidden).
# pw: members-only with a password.
accounts:
  alice: {}
  bob: {verbose: true}
  carol: {}
rooms:
  enc: {owner: alice, members: [bob, carol], members_only: true, whois: anyone}
  plain: {owner: alice, members_only: false, whois: moderators}
  new: {seed: false}
  pw: {owner: alice, members: [bob], password: pw-secret}
steps:
  # group chat service of the server
  - alice: muc-service
    expect: {service: conference.localhost}

  # new room made by /join
  - alice: join ${room.new} alice --name New room $RUN
  - alice: wait muc_joined
    match: {room: "${room.new}"}
    expect: {created: true}
  - alice: room-config ${room.new}
    expect: {membersonly: true, persistent: true, whois: anyone, public: false,
             roomname: "New room $RUN"}
  # bob is not a member
  - bob: join ${room.new} bob
  - bob: wait muc_join_error
    match: {room: "${room.new}"}
    timeout: 5
    expect: {condition: registration-required}
  # alice invites bob after his failed join: the invite must come in
  - alice: invite ${room.new} ${jid.bob} come in $RUN
  - bob: wait muc_invite
    match: {room: "${room.new}"}
    expect: {from~: "${jid.alice}", reason: "come in $RUN"}
  # join after the failed join works (the invite made bob a member)
  - bob: join ${room.new} bob
    expect: {log_text~: "Joining MUC: ${room.new}"}
  - bob: wait muc_joined
    match: {room: "${room.new}"}
  # one join per session: a second join sends no join presence
  # (the join presence is sent in a slixmpp task: not in "sent")
  - bob: join ${room.new} bob
    expect: {log_text!~: "Joining MUC: ${room.new}"}
  - bob: leave ${room.new}
  # join again at once: the room exists, nothing is created
  # leave goes to room/<our nick>
  - alice: leave ${room.new}
    save: lv
  - expect: {lv.sent.0.to: "${room.new}/alice"}
  - alice: join ${room.new} alice
  - alice: wait muc_joined
    match: {room: "${room.new}"}
    expect: {created: false}
  - alice: leave ${room.new}

  # room with a password: the invite carries it, bob joins with it
  - alice: invite ${room.pw} ${jid.bob} pw room $RUN
  - bob: wait muc_invite
    match: {room: "${room.pw}"}
    expect: {reason: "pw room $RUN", password: pw-secret}
  - bob: join ${room.pw} bob
  - bob: wait muc_join_error
    match: {room: "${room.pw}"}
    expect: {condition: not-authorized}
  - bob: join ${room.pw} bob pw-secret
  - bob: wait muc_joined
    match: {room: "${room.pw}"}
  - bob: leave ${room.pw}

  # room on a domain that does not exist: an error, not a hang
  - bob: join nope$RUN@nonexistent.localhost bob
  - bob: wait muc_join_error
    match: {room: "nope$RUN@nonexistent.localhost"}
    timeout: 40
    expect: {condition: "*"}

  # plain room
  - alice: join ${room.plain} alice
  - alice: wait muc_joined
    match: {room: "${room.plain}"}
  - bob: join ${room.plain} bob
  - bob: wait muc_joined
    match: {room: "${room.plain}"}
  - carol: join ${room.plain} carol
  - carol: wait muc_joined
    match: {room: "${room.plain}"}
  - alice: sendmuc ${room.plain} m1 hello room $RUN
    save: m1
  - bob: wait message
    match: {room: "${room.plain}", body: "m1 hello room $RUN", source: live}
    expect: {id: "${m1.msg_id}", nick: alice, encrypted: false}
  - carol: wait message
    match: {room: "${room.plain}", body: "m1 hello room $RUN", source: live}
    expect: {id: "${m1.msg_id}", nick: alice, encrypted: false}
  # resend like the app's message retry (and like Dino): the id of the first
  # send and a delay stamp (XEP-0203). It is a live message, not history.
  - alice: resendmuc ${room.plain} rsm1-$RUN 2026-01-01T10:00:00Z rsm1 resend room $RUN
    save: rsm1
  - expect: {rsm1.msg_id: "rsm1-$RUN"}
  - bob: wait message
    match: {room: "${room.plain}", body: "rsm1 resend room $RUN"}
    expect: {id: "rsm1-$RUN", nick: alice, encrypted: false, source: live,
             delay: "2026-01-01T10:00:00+00:00"}
  # join history of the resent message: the room adds its own delay
  # (from=room JID), so it stays history
  - carol: leave ${room.plain}
  - carol: join ${room.plain} carol
  - carol: wait muc_joined
    match: {room: "${room.plain}"}
  - carol: wait message
    match: {room: "${room.plain}", body: "rsm1 resend room $RUN", source: history}
    expect: {id: "rsm1-$RUN", nick: alice}
  - alice: room-features ${room.plain}
  - alice: room-config ${room.plain}
  - bob: room-config ${room.plain}
    expect_fail: true
    expect: {error~: owner-only}
  # OMEMO message in a semi-anonymous room: the tool sends it (ok=true)
  - alice: sendmucenc ${room.plain} me0 enc in plain room $RUN

  # OMEMO room
  - alice: join ${room.enc} alice
  - alice: wait muc_joined
    match: {room: "${room.enc}"}
  - bob: join ${room.enc} bob
  - bob: wait muc_joined
    match: {room: "${room.enc}"}
  - carol: join ${room.enc} carol
  - carol: wait muc_joined
    match: {room: "${room.enc}"}
  # sendmucenc encrypts for the occupants alice knows: give their presence
  # time to come in. "wait presence" does not work here: the slixmpp MUC
  # plugin sets ignore_updates on the room after the first presence, so the
  # tool gets no "presence" event for the other occupants.
  - sleep: 0.5
  - alice: sendmucenc ${room.enc} me1 enc hello room $RUN
    save: me1
  - bob: wait message
    match: {room: "${room.enc}", body: "me1 enc hello room $RUN", source: live}
    expect: {id: "${me1.msg_id}", nick: alice, encrypted: true}
  - carol: wait message
    match: {room: "${room.enc}", body: "me1 enc hello room $RUN", source: live}
    expect: {id: "${me1.msg_id}", nick: alice, encrypted: true}
  # resend with OMEMO: also a live message
  - alice: resendmucenc ${room.enc} rsm2-$RUN 2026-01-01T12:00:00+02:00 rsm2 resend enc room $RUN
    save: rsm2
  - expect: {rsm2.msg_id: "rsm2-$RUN"}
  - bob: wait message
    match: {room: "${room.enc}", body: "rsm2 resend enc room $RUN"}
    expect: {id: "rsm2-$RUN", nick: alice, encrypted: true, source: live,
             delay: "2026-01-01T10:00:00+00:00"}
  - bob: sendmucenc ${room.enc} me2 enc from bob $RUN
    save: me2
  - alice: wait message
    match: {room: "${room.enc}", body: "me2 enc from bob $RUN", source: live}
    expect: {id: "${me2.msg_id}", encrypted: true}
  - alice: sendmuc ${room.enc} m2 plain in enc room $RUN
  # reply and reaction use the room JID (bob's last message from the room)
  - bob: reply ${room.enc} 1 r3 muc reply $RUN
  - bob: react ${room.enc} 1 🎉
  - alice: wait reaction
    match: {emojis: ["🎉"], nick: bob}

  # history of the rooms
  - carol: history ${room.plain} 50 --since-run --no-skip
    known_fail: "history room: \"Couldn't find real JID\" for an OMEMO message in a semi-anonymous room"
  - carol: wait message
    match: {room: "${room.plain}", source: mam, id: "${m1.msg_id}"}
    expect: {body: "m1 hello room $RUN", archive_id: "*"}
  - carol: history ${room.enc} 50 --since-run
  - carol: mam-check ${room.enc}

  # leave
  - alice: leave ${room.plain}
    expect: {sent_types~: "presence:unavailable"}
  - bob: leave ${room.plain}
    expect: {sent_types~: "presence:unavailable"}
  - carol: leave ${room.plain}
    expect: {sent_types~: "presence:unavailable"}
  - alice: leave ${room.enc}
  - bob: leave ${room.enc}
  - carol: leave ${room.enc}
  - alice: sendmuc ${room.plain} after leave $RUN
    expect_fail: true
