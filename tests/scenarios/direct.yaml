# 1:1 chat: alice, bob and alice2 (second resource of alice, gets carbons).
accounts:
  alice: {}
  bob: {}
  alice2: {jid: alice@localhost/second}
steps:
  # send, sendenc and carbons
  - alice: send ${jid.bob} p1 hello $RUN
    save: p1
  - bob: wait message
    match: {body: "p1 hello $RUN", encrypted: false, source: live}
    expect: {id: "${p1.msg_id}", origin_id: "${p1.msg_id}", stanza_id: "*"}
  - alice2: wait message
    match: {body: "p1 hello $RUN", source: carbon}
    expect: {id: "${p1.msg_id}"}
  - alice: sendenc ${jid.bob} e1 secret $RUN
    save: e1
  - bob: wait message
    match: {body: "e1 secret $RUN", encrypted: true, source: live}
    expect: {id: "${e1.msg_id}"}
  - alice2: wait message
    match: {body: "e1 secret $RUN", encrypted: true, source: carbon}
    expect: {id: "${e1.msg_id}"}

  # reply (bob replies to the last message from alice = e1)
  - bob: reply ${jid.alice} 1 r1 plain reply $RUN
    save: r1
  - alice: wait message
    match: {body~: "r1 plain reply $RUN"}
    expect: {id: "${r1.msg_id}", body_clean: "r1 plain reply $RUN", reply_to_id: "${e1.msg_id}"}
  # replyenc to the second last message from alice = p1
  - bob: replyenc ${jid.alice} 2 r2 enc reply $RUN
    save: r2
  - alice: wait message
    match: {body~: "r2 enc reply $RUN"}
    expect: {id: "${r2.msg_id}", encrypted: true}
    save: r2r
  - expect: {r2r.reply_to_id: "${p1.msg_id}"}
    known_fail: "replyenc: received message has no reply_to_id"

  # corrections: edit = last sent (e1), editid 2 = second last (p1)
  - alice: edit ${jid.bob} e1 secret $RUN EDITED
  - bob: wait message
    match: {body: "e1 secret $RUN EDITED"}
    expect: {source: correction, replace_id: "${e1.msg_id}", encrypted: true}
  - alice: editid ${jid.bob} 2 p1 hello $RUN EDITED
  - bob: wait message
    match: {body: "p1 hello $RUN EDITED"}
    expect: {source: correction, replace_id: "${p1.msg_id}", encrypted: false}

  # reactions to the last message from alice (e1)
  - bob: react ${jid.alice} 1 👍
  - alice: wait reaction
    match: {emojis: ["👍"]}
    expect: {id: "${e1.msg_id}"}
  - bob: unreact ${jid.alice} 1
  - alice: wait reaction
    match: {emojis: []}

  # receipt, marker, chat states
  # bob sent an automatic receipt for e1: take it before /receipt
  - alice: wait receipt
    match: {id: "${e1.msg_id}", from~: "bob@"}
  - bob: receipt ${jid.alice} ${e1.msg_id}
  - alice: wait receipt
    match: {id: "${e1.msg_id}", from~: "bob@"}
  - bob: marker ${jid.alice} ${e1.msg_id} displayed
  - alice: wait marker
    match: {id: "${e1.msg_id}", marker: displayed}
  - alice: typing ${jid.bob}
  - bob: wait chat_state
    match: {state: composing}
  - alice: active ${jid.bob}
  - bob: wait chat_state
    match: {state: active}

  # history (MAM), only the messages of this run
  - alice: history ${jid.bob} 1000 --since-run
  - alice: wait message
    match: {source: mam, id: "${p1.msg_id}"}
    expect: {archive_id: "*"}
  - alice: mam-check ${jid.alice}
  - alice: carbons

  # received carbon: bob sends to alice, alice2 gets it
  - bob: send ${jid.alice} p3 from bob $RUN
    save: p3
  - alice2: wait message
    match: {body: "p3 from bob $RUN"}
    expect: {id: "${p3.msg_id}"}
